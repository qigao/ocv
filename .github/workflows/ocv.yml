name: OpenCV CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      profile:
        description: OpenCV build profile
        type: choice
        options: [static, shared, world, all]
        default: static

permissions:
  contents: read

concurrency:
  group: opencv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    if: inputs.profile != 'world' && inputs.profile != 'shared'
    name: Static / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: macos-x64, runner: macos-15-intel }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x64, runner: windows-2025, arch: x64 }
          - { platform: windows-arm64, runner: windows-11-arm, arch: arm64 }
          - { platform: windows-x64-msvc, runner: windows-2025, arch: x64 }
          - { platform: windows-arm64-msvc, runner: windows-11-arm, arch: arm64 }
          - { platform: android-x64, runner: ubuntu-24.04 }
          - { platform: android-arm64, runner: ubuntu-24.04 }
    uses: ./.github/workflows/build-opencv.yml
    with:
      profile: static
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch || '' }}

  shared:
    if: inputs.profile == '' || inputs.profile == 'shared' || inputs.profile == 'all'
    name: Shared / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
          - { platform: macos-x64, runner: macos-15-intel }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: android-x64, runner: ubuntu-24.04 }
          - { platform: android-arm64, runner: ubuntu-24.04 }
          - { platform: windows-x64, runner: windows-2025, arch: x64 }
          - { platform: windows-arm64, runner: windows-11-arm, arch: arm64 }
          - { platform: windows-x64-msvc, runner: windows-2025, arch: x64 }
          - { platform: windows-arm64-msvc, runner: windows-11-arm, arch: arm64 }
    uses: ./.github/workflows/build-opencv.yml
    with:
      profile: shared
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch || '' }}

  world:
    if: inputs.profile == 'world' || inputs.profile == 'all'
    name: World / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64-ubuntu22.04, runner: ubuntu-22.04 }
          - { platform: linux-x64-ubuntu24.04, runner: ubuntu-24.04 }
          - { platform: windows-x64, runner: windows-2025, arch: x64 }
    uses: ./.github/workflows/build-opencv.yml
    with:
      profile: world
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch || '' }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, shared]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: opencv-*
          merge-multiple: true
          path: release
      - name: Publish OpenCVLite SDKs
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum opencv-*.tar.gz > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            opencv-*.tar.gz SHA256SUMS
