name: Publish OpenCVLite v0.1.1

on:
  push:
    branches: [release/v0.1.1]

permissions:
  actions: read
  contents: read

concurrency:
  group: ocv-v0.1.1-release

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      CI_RUN: '43051737242'
      CI_HEAD: ca0958b829f2223c01fcd77708d6feb9e0b952b0
      RELEASE_COMMIT: a3383fcdae1662c23a935a41d3e0a84797c9c6d7
      RELEASE_TAG: v0.1.1
    steps:
      - name: Verify the source and build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq '[.head_sha, .conclusion] | @tsv')
          test "$run" = "$CI_HEAD"$'\t'success
          checked_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$CI_HEAD" --jq .tree.sha)
          release_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$RELEASE_COMMIT" --jq .tree.sha)
          test "$checked_tree" = "$release_tree"
      - uses: actions/download-artifact@v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CI_RUN }}
          pattern: opencv-*
          merge-multiple: true
          path: release
      - name: Publish verified OpenCVLite packages
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          targets=(linux-x64 linux-arm64 macos-x64 macos-arm64 android-x64 android-arm64
                   windows-x64 windows-arm64 windows-x64-msvc windows-arm64-msvc)
          assets=()
          for profile in static shared; do
            for target in "${targets[@]}"; do
              archive="opencv-4.11.0-$profile-$target.tar.gz"
              test -s "$archive"
              assets+=("$archive")
            done
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --notes-file - \
            "${assets[@]}" SHA256SUMS <<'NOTES'
          OpenCVLite 4.11.0 SDKs for the `core` and `imgproc` modules.

          - Static and shared packages for Linux, macOS, and Android on x64 and ARM64.
          - Static and shared Windows packages for LLVM-MinGW and MSVC on x64 and ARM64.
          - `SHA256SUMS` covers all 20 archives.

          Built by [OpenCV CI](https://github.com/qigao/ocv/actions/runs/43051737242).
          NOTES
